name: Build Production Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Build production APK locally
        working-directory: frontend
        env:
          EXPO_PUBLIC_API_URL: https://bubbly-chatapp.onrender.com
          EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: dafb37rpe
          EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET: images_1
          EXPO_PUBLIC_AGORA_APP_ID: ff4f2dea21944c55b1512724e18448aa
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: eas build --platform android --profile production-apk --local --non-interactive --output bubbly-production.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubbly-production-apk
          path: frontend/bubbly-production.apk
          if-no-files-found: error
