name: Build Production Android APK

on:
  workflow_dispatch:

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      - name: Configure Google Services JSON (optional)
        working-directory: frontend
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -z "${GOOGLE_SERVICES_JSON:-}" ]; then
            echo "GOOGLE_SERVICES_JSON secret is not set; building without google-services.json."
            exit 0
          fi
          if printf '%s' "$GOOGLE_SERVICES_JSON" | grep -q '^[[:space:]]*{'; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > google-services.json
          else
            printf '%s' "$GOOGLE_SERVICES_JSON" | tr -d '\r\n' | base64 --decode > google-services.json
          fi
          node -e "JSON.parse(require('fs').readFileSync('google-services.json', 'utf8'));"
          cp google-services.json "${RUNNER_TEMP}/google-services.json"
          echo "GOOGLE_SERVICES_JSON_PATH=${RUNNER_TEMP}/google-services.json" >> "$GITHUB_ENV"

      - name: Build production APK
        working-directory: frontend
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4096m -XX:MaxMetaspaceSize=1024m"
          JAVA_TOOL_OPTIONS: "-XX:MaxMetaspaceSize=1024m"
          EXPO_PUBLIC_API_URL: https://bubbly-chatapp.onrender.com
          EXPO_PUBLIC_CLOUDINARY_CLOUD_NAME: dafb37rpe
          EXPO_PUBLIC_CLOUDINARY_UPLOAD_PRESET: images_1
          EXPO_PUBLIC_AGORA_APP_ID: ff4f2dea21944c55b1512724e18448aa
          EXPO_PUBLIC_SENTRY_DSN: ${{ secrets.EXPO_PUBLIC_SENTRY_DSN }}
          EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID: ${{ secrets.EXPO_PUBLIC_GOOGLE_ANDROID_CLIENT_ID }}
        run: |
          if [ -n "${EXPO_TOKEN:-}" ]; then
            echo "EXPO_TOKEN detected - building via EAS local build..."
            npm install -g eas-cli
            eas build --platform android --profile production-apk --local --non-interactive --output bubbly-production.apk
          else
            echo "EXPO_TOKEN not set - building release APK via Expo prebuild + Gradle..."
            npx expo prebuild --platform android --no-install
            cd android
            chmod +x gradlew
            ./gradlew assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk ../bubbly-production.apk
          fi

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: bubbly-production-apk
          path: frontend/bubbly-production.apk
          if-no-files-found: error
